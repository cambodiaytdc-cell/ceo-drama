<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#121836" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer subtle glowing border / ring -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#playGrad)" stroke-width="4" opacity="0.6" />

  <!-- Play Triangle with Glow -->
  <polygon points="180,120 380,256 180,392" fill="url(#playGrad)" filter="url(#glow)" />
  <polygon points="180,120 380,256 180,392" fill="url(#playGrad)" />

  <!-- Text CEO DRAMA at bottom -->
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="white" text-anchor="middle" letter-spacing="4">CEO DRAMA</text>
  <!-- Subtle line under text -->
  <rect x="130" y="468" width="252" height="4" rx="2" fill="url(#playGrad)" />
</svg>
